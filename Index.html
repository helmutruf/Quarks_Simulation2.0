<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="description" content="Interaktive Echtzeit-Simulation von Quarks, Gluonen und dem Standardmodell – wissenschaftlich inspiriert, endlos animiert." />
<title>Quarks 2.0 — Interaktive Teilchenphysik</title>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div id="app">
  <header id="topbar">
    <h1 id="title">Die Welt der Quarks &amp; Gluonen</h1>
    <p id="subtitle"></p>
    <div id="controls">
      <button id="lang-toggle" class="btn">🌐 <span id="lang-label">DE</span></button>
      <button id="play-toggle" class="btn">⏸</button>
      <button id="reset" class="btn">↻</button>
      <label>Speed <input type="range" id="speed" min="0.1" max="3" step="0.1" value="1" /><span id="speed-val">1.0×</span></label>
      <label>Confinement <input type="range" id="force" min="0.01" max="0.25" step="0.01" value="0.08" /></label>
      <label>Qualität
        <select id="quality">
          <option value="low">Niedrig</option>
          <option value="mid" selected>Mittel</option>
          <option value="high">Hoch (HD)</option>
        </select>
      </label>
    </div>
  </header>

  <main id="stage">
    <canvas id="canvas" aria-label="Quark-Simulation"></canvas>
    <aside id="sidebar">
      <h2 id="mode-title-label">Modus</h2>
      <div id="mode-buttons"></div>
      <button id="action" class="action-btn">Aktion</button>
      <div id="info"></div>
      <div id="stats"></div>
    </aside>
  </main>

  <footer id="footer">
    <p id="footer1"></p>
    <p id="footer2"></p>
  </footer>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
